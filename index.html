<template id="page-scope">
<p>The field of Group Decision and Negotiation focuses on decision processes with at least two participants and a common goal. Such processes are complex and self-organizing and constitute multi-participant, multi-criteria, ill-structured, dynamic, creative, and often evolutionary problems. Major approaches include</p><p>(1) information systems, in particular, negotiation support systems (NSSs) and group decision support systems (GDSs),</p><p>(2) cognitive and behavioural sciences as applied to group decision and negotiation,</p><p>(3) conflict analysis and resolution,</p><p>(4) applied game theory, experiment and social choice,</p><p>(5) artificial intelligence, and</p><p>(6) management science as it relates to group decision making and negotiation. Many research initiatives combine two or more of these approaches.</p><p>Group decisions and negotiations can be performed in an intra-organisational as well as an inter-organisational context. Both consist of complex processes, including preference elicitation, proposals and counter-proposals, preference adjustment, and choice. Communication and decision making are the two key process steps in Group Decision and Negotiation and thus require sophisticated support in many ways.</p><p>Application areas of Group Decision and Negotiation include intra-organisational and inter-organisational coordination (as in operations management and integrated design, production, finance, marketing and distribution functions, such as coordination of all phases of the life cycle of a product), computer-supported collaborative work and meetings, electronic negotiations including negotiating agents and negotiation support systems, labour-management negotiations, inter-organisational, intercultural negotiations, environmental negotiations, and many others. See the <em>Group Decision and Negotiation</em> journal for further illustrations of the scope of the GDN field.</p><h2 id="section-9">Themes and areas of interest:</h2><h2 id="section-10">Methodological &amp; Theoretical Foundations</h2><ul><li>Auction theory</li><li>Bargaining theory</li><li>Collaboration engineering</li><li>Conflict analysis and resolution</li><li>Design research in negotiation systems</li><li>Game theory</li><li>Multicriteria decision making</li><li>Decision and negotiation analysis</li><li>Social choice theory</li><li>Modelling and simulation using software agents</li><li>Machine learning</li></ul><h2 id="section-22">Technological Foundations</h2><ul><li>Animation and visualization</li><li>Artificial intelligence methods in GDN</li><li>Distributed GDN technologies</li><li>E-negotiation platforms and systems</li><li>Multi-agent systems</li><li>Virtual worlds and environments for GDN</li><li>Collaborative Information Technologies</li></ul><h2 id="section-30">Behavioral Aspects</h2><ul><li>Comparisons of auction and negotiation mechanisms</li><li>Creativity in GDN</li><li>Characteristics of cross-cultural and intracultural negotiation</li><li>Facilitation</li><li>Impact, adoption and evaluation of GDN technologies</li><li>Interaction of human and software agents</li><li>Experimental studies in GDN</li><li>Learning and teaching</li></ul><h2 id="section-39">Applications</h2><ul><li>Business</li><li>Policy</li><li>Diplomacy and International Relationships</li><li>Education</li><li>Water and Natural Resources</li><li>Sustainability</li><li>Software engineering</li></ul><p>Research in Group Decision and Negotiation has continued to expand, and many new research directions have been proposed. At GDN conferences, we encourage researchers to present research in Group Decision and Negotiation even if (in fact, especially if) it does not fit into any of the above areas.</p>
</template>

<div class="notice">The 2027 award arrangements and prize amounts will be announced. The following describes the established award categories and eligibility framework.</div><h2>Conference Paper Awards</h2><p>Full papers presented at GDN 2027 may be considered for the Best Paper and Best Student Paper competitions, subject to the final award rules. Both competitions require oral presentations.</p><h3>Best Student Paper</h3><ul><li>The author must not have completed the PhD.</li><li>The student must be the first author; a supervisor may be a co-author.</li><li>The student must present the paper at the conference.</li><li>The submission must be a full paper, rather than an abstract or extended abstract.</li></ul><h3>Best Paper</h3><p>This competition recognizes outstanding research presented at the conference. Selected authors may be encouraged to develop their work for the <em>Group Decision and Negotiation</em> journal.</p><h2>Group Decision and Negotiation Section Award</h2><p>This award recognizes outstanding contributions to research in Group Decision and Negotiation and/or service to the GDN community. Contributions may be recent or extend over a recipient’s lifetime. A citation describes the recipient’s contributions.</p><p>Nomination instructions, deadlines and presentation arrangements for 2027 will be announced.</p><h2>Gregory Kersten GDN Journal Best Paper Award</h2><p>This annual award commemorates Gregory Kersten and recognizes outstanding papers published in the <em>Group Decision and Negotiation</em> journal. The 2027 announcement will be added when available.</p>

<p>You are cordially invited to submit papers to the <strong>27th International Conference on Group Decision and Negotiation, GDN 2027</strong>, hosted by <strong>Sichuan University</strong> in Chengdu, China, <strong>6–9 June 2027</strong>.</p><div class="notice">See the Important Dates page for the 2027 submission schedule and the Streams page for the research areas. The opening of the 2027 submission portal will be announced.</div><p>The field of Group Decision and Negotiation focuses on decision processes with at least two participants and a common goal. Such processes are complex and self-organising and constitute multi-participant, multi-criteria, ill-structured, dynamic, creative, and often evolutionary problems. Major approaches include:</p><ul><li>Information systems, in particular negotiation support systems (NSSs) and group decision support systems (GDSs)</li><li>Cognitive and behavioural sciences as applied to group decision and negotiation</li><li>Conflict analysis and resolution</li><li>Applied game theory, experiment and social choice</li><li>Artificial intelligence</li><li>Management science as it relates to group decision making and negotiation. Many research initiatives combine two or more of these approaches.</li></ul><p>Group Decision and Negotiation can be performed in an intra-organisational as well as an inter-organisational context. Both consist of complex processes, including preference elicitation, proposals and counter-proposals, preference adjustment, and choice. Communication and decision making are the two key process steps in Group Decision and Negotiation and thus require sophisticated support in many ways.</p><p>Application areas of Group Decision and Negotiation include intra-organisational and inter-organisational coordination (as in operations management and integrated design, production, finance, marketing and distribution functions, such as coordination of all phases of the life cycle of a product), computer-supported collaborative work and meetings, electronic negotiations including negotiating agents and negotiation support systems, labour-management negotiations, inter-organisational, intercultural negotiations, environmental negotiations, and many others.</p><h2 id="section-10">Themes and areas of interest include but are not limited to the following:</h2><h2 id="section-11">Methodological &amp; Theoretical Foundations</h2><ul><li>Auction theory</li><li>Bargaining theory</li><li>Collaboration engineering</li><li>Conflict analysis and resolution</li><li>Design research in negotiation systems</li><li>Game theory</li><li>Multicriteria decision making</li><li>Decision and negotiation analysis</li><li>Social choice theory</li><li>Modelling and simulation using software agents</li><li>Machine learning</li></ul><h2 id="section-23">Technological Foundations</h2><ul><li>Animation and visualization</li><li>Artificial intelligence methods in GDN</li><li>Distributed GDN technologies</li><li>E-negotiation platforms and systems</li><li>Multi-agent systems</li><li>Virtual worlds and environments for GDN</li><li>Collaborative information technologies</li><li>Group support systems</li></ul><h2 id="section-32">Behavioral Aspects</h2><ul><li>Comparisons of auction and negotiation mechanisms</li><li>Creativity in GDN</li><li>Characteristics of cross-cultural and intracultural negotiation</li><li>Emotions in GDN</li><li>Gender and negotiation</li><li>Facilitation</li><li>Impact, adoption and evaluation of GDN technologies</li><li>Interaction of human and software agents</li><li>Experimental studies in GDN</li><li>Learning and teaching</li><li>Micro-Processes</li></ul><h2 id="section-44">Applications</h2><ul><li>Business</li><li>Policy</li><li>Diplomacy and international relationships</li><li>Education</li><li>Water and natural resources</li><li>Sustainability</li><li>Software engineering</li></ul><p>Papers can be submitted as full papers to be published either in Conference proceedings by Springer in the Book series of LNBIP (<a href="https://link.springer.com/series/7911" target="_blank" rel="noopener noreferrer">Lecture Notes in Business Information Processing</a> or as abstracts/extended abstracts/full papers to be published in Local Proceedings.</p><p>In the Local Proceedings the authors will keep the copyright. After the reviewing process, the authors could choose to replace their full paper in the Local Proceedings for abstract only. However, to be considered for the Conference Awards evaluation process, those papers should be available as full papers in the Local Proceedings, which will be available on the conference webpage under password protection and accessible only to conference participants. The Local Proceedings will also include the accepted posters.</p><p>The topics are organized in conference streams that can be found on the website (<a href="#streams" target="_blank" rel="noopener noreferrer">click here</a>. Research in Group Decision and Negotiation has continued to expand, and many new research directions have been proposed. At GDN conferences, we encourage researchers to present research in Group Decision and Negotiation even if (in fact, especially if) it does not fit into any of the above areas.</p>

<template id="page-streams">
<section class="propose-stream"><span class="eyebrow">Help shape the conversation</span><h2>Propose a stream</h2><p>Proposals for streams, sessions and panels are welcome until <strong>14 November 2026</strong>. Please include a title, a short description of the scope, and the names and affiliations of the organizers.</p><a class="btn" href="mailto:gdn2027@gdnconference.org?subject=GDN%202027%20Stream%20Proposal">Send a stream proposal</a></section>

<details class="stream-section" open><summary>Conflict Resolution</summary><div class="stream-body"><p>Stream organizers:</p><p>Liping Fang, Toronto Metropolitan University, Canada<br>Keith W. Hipel, University of Waterloo, Waterloo, Canada<br>D. Marc Kilgour, Wilfrid Laurier University, Waterloo, Canada</p><p>Stream description:</p><p>Strategic conflict arises whenever humans interact, individually or in groups. New, recently-developed methodologies and techniques that can help analysts understand strategic conflicts and provide strategic support to negotiators have been of great benefit to many decision makers. New theoretical issues are being explored, and at the same time new software systems are making modeling easier and analytical results clearer. Theoretical and practical advances have been utilized to study strategic conflicts arising in diverse areas including environmental management, global warming, energy projects, the food crisis, economic disparities, international trade and aging infrastructure. The main objective of the Stream on Conflict Resolution is to provide a forum for discussion of research advances on the development of formal approaches to conflict resolution with insightful applications in a range of domains. Prospective authors are cordially invited to submit original research developments and applications.</p></div></details><details class="stream-section" ><summary>Negotiation Support Systems and Studies (NS3)</summary><div class="stream-body"><p>Stream organizers:</p><p>Stream description:</p><p>Electronic negotiations (or digital negotiations) are nowadays common business practice. The most important digital support is provided by dedicated Negotiation Support Systems (NSSs). These systems enable complex, asynchronous, and dislocated negotiations.</p><p>NSSs have always had the goal to support human intelligence. That goal has become broader in recent years incorporating Artificial Intelligence (AI) into system development and system design to enable the support of human intelligence by means of Artificial Intelligence.</p><p>Researchers, developers and practitioners who design and develop NSSs with or without AI, who study the use of NSSs in simulations and in the field, or who incorporate NSS components into negotiation, mediation and facilitation are invited to participate in the NS3 stream. We also encourage research addressing digital transformation of negotiations, i.e. how negotiation support systems transform organisations, processes, and practices.</p><p>We solicit papers looking at theory or practice or both. In particular, we seek papers that help bridging the gap between the vast amount of work on face-to-face negotiations and electronic negotiations as well as decision and negotiation aids embedded in negotiation processes. We also seek papers that focus on the design and use of tools for decision support, communication support, document management, or conflict management for the negotiators and mediators in electronic negotiation processes. Furthermore, we specifically look for papers on AI and NSSs, be it using Machine Learning, Generative AI, or some other type of AI.</p><p>One goal of the NS3 stream is to show the latest technological advances in NSS research and the current research in NSSs as well as in negotiation agents and their use in e-negotiation processes.</p><p>Topics of interest include but are not limited to:</p><ul><li>Digital transformation of business negotiations</li><li>Artificial Intelligence in e-negotiations</li><li>Machine learning as a research method in negotiation research</li><li>Design of negotiation support systems</li><li>Empirical research on negotiation support systems</li><li>Bilateral, multi-bilateral and multi-lateral e-negotiations</li><li>Cross-cultural online negotiations</li><li>Electronic mediation and facilitation</li><li>New applications for e-negotiations</li></ul></div></details><details class="stream-section" ><summary>Preference Modeling for Group Decision and Negotiation</summary><div class="stream-body"><p>Stream organizers:</p><p>Tomasz Wachowicz, Katowice School of Economics, Poland<br>Danielle Morais, Federal University of Pernambuco, Brazil</p><p>Stream description:</p><p>A variety of methods, techniques and normative models may be used for supporting group of negotiators and decision makers (DM) in defining their goals, eliciting preferences and building the negotiation offers’ scoring systems, often integrated with multicriteria decision making (MCDM) and game theory. Cognitive issues, formal knowledge and skills of DMs influence the redesigning of existing and designing the new methods for preference modeling and elicitation for group decision and negotiation (GDN) process. In order to make these models and methods more appropriate for real-world decision problems, preference modeling approaches need to be continuously improved, considering behavioural issues and DMs’ limitations regarding information and perception for evaluating preferences.</p><p>The main goal of this stream is to create a forum for scientists, researchers and practitioners working on the topic of preference modeling for GDN that will allow to exchange their experience and knowledge, and discussing the recent developments and results of their research. Thus we invite contributors to submit to this stream the papers and sessions. Although not limited to, the stream includes following topics:</p><ul><li>Preference modeling in GDN problems</li><li>Methodological issues of preference analysis</li><li>Preference issues for choosing voting procedures</li><li>Preference modeling for mediation and arbitration</li><li>Preference learning</li><li>Behavioral studies on preference for GDN</li><li>Neuroscience experiments on preference for GDN</li><li>Experimental studies on preference for group decision and negotiation</li><li>Experimental studies on decision makers’ cognitive capabilities and needs for formal support in group decision and negotiation</li><li>Interfaces between GDN and MCDM</li><li>Use of MCDM methods for preference modeling in group decision and negotiation</li><li>Preferences in group decisions for MCDM</li><li>Group decision support based on partial information on preferences</li><li>Handling the imprecise and vague preference information</li><li>Preference aggregation of decision makers versus knowledge aggregation of experts</li><li>Group decision support based on partial information onexperts’ knowledge</li></ul></div></details><details class="stream-section" ><summary>Collaborative Decision Making</summary><div class="stream-body"><p>Stream organizers:</p><p>Pascale Zaraté, Toulouse Capitole University, France<br>Guy Camilleri, Université Paul Sabatier, France</p><p>Stream description:</p><p>Making a decision for a group engaged in a common task is a difficult challenge. There are several kinds of group decision making processes. This stream addresses Collaborative Decision Making processes. By Collaborative Decision Making processes, we intend that involved participants must pool their efforts in order to define and work on the achievement of a common goal. They have to integrate multiple points of view which reveal to be difficult. They have to work together, although not necessarily in the same place or at the same time. Decisional processes are then complex and involve a non-closed set of actors. The difficult point for decision-makers is to make a balance between their own preferences and the building of common preferences within the group. One direct application in the daily life of such Collaborative Decision-Making processes can be implemented through the e_democraty which is defined as a form of government in which all adult citizens are presumed to be eligible to participate equally in the proposal, development, and creation of laws.</p><p>The purpose of this stream is to allow researchers to present methodologies, mathematical models, and software supporting Collaborative Decision-Making processes. Submitted papers/abstracts can describe both theoretical and empirical studies like for example survey, field study, case study, experimentation…</p></div></details><details class="stream-section" ><summary>Intelligent Group Decision Making and Consensus Process</summary><div class="stream-body"><p>Stream organizers:</p><p>Zhen Zhang, Dalian University of Technology, China.<br>Yucheng Dong, Sichuan University, China.<br>Francisco Chiclana, De Montfort University, UK.<br>Enrique Herrera-Viedma, University of Granada, Granada, Spain.</p><p>Stream description:</p><p>In the contemporary era, group decision making has emerged as a pivotal approach for addressing complex and multifaceted problems. This process involves the collaboration of at least two experts who work together to devise solutions for predefined decision problems. With the rapid advancement of information and communication technology and the emergence of new decision paradigms such as Web 2.0, social networks, and e-democracy, decision environments have become increasingly intricate. The integration of intelligent technologies, particularly machine learning and artificial intelligence (AI), into group decision making has garnered significant attention from academics, researchers, and practitioners across various domains. AI-driven methodologies have shown promise in enhancing decision making processes by leveraging sophisticated algorithms and data analytics to improve the accuracy, efficiency, and effectiveness of group decisions.</p><p>Moreover, achieving satisfactory solutions in group decision making often requires a consensus process, wherein decision-makers engage in discussions, negotiations, and revisions of their opinions to reach a mutually agreed-upon level of agreement. This consensus process is crucial for ensuring that diverse perspectives are considered, thereby increasing the likelihood of successful implementation.</p><p>The aim of this stream is to create a platform where researchers and practitioners can converge to discuss cutting-edge advancements in intelligent group decision making and consensus process. We invite contributions that explore the theoretical, methodological, and practical aspects of these topics, as well as their applications in real-world decision making scenarios. Topics of interest include, but are not limited to:</p><ul><li>Information fusion in intelligent group decision making</li><li>Computational intelligence-based group decision making</li><li>Data-driven group decision making</li><li>Generative AI-based group decision making</li><li>Preference learning in group decision making</li><li>Consensus modeling in group decision making</li><li>Opinion dynamics and social network-based consensus modeling</li><li>Behavior management in consensus modeling</li><li>Decision support systems and software for intelligent group decision making and consensus modeling</li><li>Real-world applications of intelligent group decision making and consensus modeling in various fields, such as healthcare, finance, transportation, and digital transformation</li></ul></div></details><details class="stream-section" ><summary>Risk Evaluation and Negotiation Strategies</summary><div class="stream-body"><p>Stream organizers:</p><p>Stream description:</p><p>Risk evaluation over business, programs, and conflicts are commonly observed and extensively analyzed in the real world. Risks in complex systems have been paid increasing attentions by researchers. Formal methodologies have been developed to help understand risks in negotiation and discover courses of action to reach desired agreements. The main purpose of this stream is to provide a forum to present novel risk evaluation models and their applications to negotiation. The topics of interest includes but are not limited to:</p><ul><li>Risk evaluation models and tools</li><li>Conflict intervention</li><li>Negotiation models and tools</li><li>Negotiation strategies with third-party intervention</li><li>Attitude and behavior of intervention</li></ul></div></details><details class="stream-section" ><summary>Data Analytics as the Vehicle Assisting Negotiation Diplomacy</summary><div class="stream-body"><ul><li>how to combine clustering of countries/partners with multi-criteria portfolio selection and fair distribution between joint projects</li><li>how to operationalize indicators (innovation and scientometrics, mobility and human capital flows) into coalition rules and contract templates</li><li>how to develop multi-level negotiations that align with the goals of universities, ministries, sponsors, cities and diaspora networks</li><li>how to mitigate risks (data, talent, infrastructure) and implement open science commitments in agreements</li><li>how ethnic capital shapes collective preferences, trust, and migration policy development, and how to account for these effects in partner selection and negotiation models (e.g., measurement through surveys and network data, integration into AHP weights/constraints, and scenario analysis for policy trade-offs).</li></ul></div></details><details class="stream-section" ><summary>Artificial Intelligence in Group Decision and Negotiation</summary><div class="stream-body"><ul><li>Machine learning for decision-making and negotiation support</li><li>Pattern recognition in group decision and negotiation processes</li><li>AI-based preference modelling in group decisions</li><li>AI in negotiation strategies and conflict resolution</li><li>AI-enabled transparency, fairness, and trust in group decision-making</li><li>AI teammates in hybrid teams and negotiation settings</li><li>Emotional and affective AI in group negotiation processes</li><li>Dynamic adaptation and AI’s influence on group cohesion and decision dynamics</li></ul></div></details><details class="stream-section" ><summary>Behavioural Issues in Model-driven Group Decision Support</summary><div class="stream-body"><h2 id="section-0">Stream Organiser:</h2><p>L. Alberto Franco, University of Bristol Business School, UK</p><h2 id="section-2">Stream Description:</h2><p>Model-driven group decision support (GDS) is an approach to facilitating group decision making in which a formal, transparent model serves as the central mechanism for structuring discussion, enabling negotiation, and supporting analysis. In this approach, the model—rather than technology or social process alone—is the primary vehicle through which participants collectively explore, understand, and reach agreement about a problem situation.</p><p>This stream invites contributions that examine behavioural issues related to the design, use, and evaluation of model-driven GDS in both laboratory and field settings. Central to the stream is a focus on understanding what people actually do when they engage with model-drive GDS methods, procedures, and tools, and how their behaviours, cognitions, and emotions shape—and are shaped by—the use of such approaches.</p><p>We particularly welcome empirical studies that report on the application of model-driven GDS with face-to-face or virtual teams working on:</p><ul><li>Cross-functional and interdisciplinary decision making</li><li>Strategy and policy analysis and evaluation</li><li>Inter-organisational collaboration and partnership working</li></ul><p>The stream also seeks contributions that advance theoretical and practical understanding of model-driven GDS approaches. Topics of interest include, but are not limited to:</p><ul><li>Problem structuring methods (e.g. SODA, SSM, Strategic Choice)</li><li>Facilitated modelling approaches (e.g. Group Model Building, Decision Conferencing)</li><li>Games and simulation-gaming approaches for group decision support</li><li>The role of technology in supporting model-driven GDS</li></ul><p>Finally, we welcome research that examines the development of competences and skills required for effective model-driven GDS, including facilitation, modelling and the management of group dynamics.</p></div></details><details class="stream-section" ><summary>Responsible NSS in the age of Generative AI</summary><div class="stream-body"><p>Stream organizers:</p><p>Tung Bui, University of Hawaii Shidler College of Business</p><p>Stream description:</p><p>The rapid rise of generative AI has led to intelligent applications across many domains, including group decision and negotiation systems (GDNSS). While these technologies hold great promise for enhancing efficiency, effectiveness, and adaptability, they also raise global concerns around transparency, bias, ethical issues, and potential misuse.</p><p>This research stream explores the opportunities, limitations, and risks of generative AI in GDNSS and related fields such as conflict resolution, multi-agent systems, and collaborative environments. We invite position papers, empirical studies, and case analyses on the design, implementation, and ethical implications of AI in decision-making and negotiation systems. Key areas of interest include developing innovative applications of AI in GDNSS and ensuring transparency, fairness, accountability, and addressing broader societal impacts.</p><p>We welcome submissions from disciplines such as business, public policy, social sciences, and computer science that examine responsible AI design, development, and use in GDNSS to promote transparent, fair, and accountable systems while mitigating risks.</p></div></details><details class="stream-section" ><summary>Quantum Cognition for Group Decision Making</summary><div class="stream-body"><p>Stream organizers:</p><p>Zaiwu Gong, Nanjing University of Information Science and Technology, China<br>Xuanhua Xu, Central South University, China<br>Mei Cai, Nanjing University of Information Science and Technology, China<br>Ligang Zhou, Anhui University, China<br>Fanyong Meng, Nanjing University of Information Science and Technology, China<br>Nannan Wu, Nanjing University of Information Science and Technology, China</p><p>Stream description:</p><p>It uses the mathematical methods of quantum mechanics theory to construct models for phenomena in the philosophy of cognitive science (such as decision making, consciousness, mind, etc.) and describe human cognition, especially decision-making behavior. This theory breaks the confinement of classical probability theory in traditional decision models and can better simulate complex, fuzzy, multidimensional cognitive and decision-making processes. In addition, the process of consensus reaching among decision makers is similar to the interaction process in a quantum system. With the sharing and discussion of information, opinions gradually merge and eventually reach a common decision.</p><p>In recent years, the application of quantum decision making has increased since its flexibility and rigor. However, compared with other more mature decision models, the study of quantum decision making is still at the initial stages. Therefore, the aim of this stream is to provide a platform for experts, scholars, and practitioners to exchange ideas and discuss quantum cognition group decision making and its applications. Topics of interest include, but are not limited to:</p><ul><li>Group consensus optimization model based on a quantum-like Bayesian network</li><li>Belief superposition and intervention modeling for decision makers</li><li>Order effect model of evaluation information or objects in group decision making</li><li>Modeling of the quantum entanglement phenomenon in the process of group consensus reaching</li><li>Quantum game-based conflict mediation model</li><li>The application of quantum decision theory in medical treatment, meteorological disasters, emergency management, etc.</li></ul></div></details><details class="stream-section" ><summary>Facilitated decision modeling in the co-design of operations systems</summary><div class="stream-body"><p>Stream organizers:</p><p>Gilberto Montibeller, University of Bristol Business School<br>Jarrod Goentzel, MIT Center for Transportation and Logistics<br>Milena Janjevic, MIT Center for Transportation and Logistics</p><p>Stream description:</p></div></details><details class="stream-section" ><summary>Networks in GDN</summary><div class="stream-body"><p>Stream organizers:</p><p>Fuad Aleskerov, HSE University, Moscow, Russia</p><p>Stream description:</p><p>The session covers all papers concerning the use of network models in different aspects of group decisions and negotiations. In particular, we consider papers dealing with centrality measures in conflict analysis, different applications of social networks analysis in conflict resolution and group decisions.</p></div></details><details class="stream-section" ><summary>Human, Social, and Artificial Cognition in Group Decision and Negotiation</summary><div class="stream-body"><p>Stream organizers:</p><p>Alberto Turón, School of Business and Economics, University of Zaragoza, Zaragoza, Spain.<br>Jorge Navarro, School of Business and Economics, University of Zaragoza, Zaragoza, Spain.<br>José María Moreno-Jiménez, School of Business and Economics, University of Zaragoza, Zaragoza, Spain.</p><p>Stream description:</p><p>The latest Group Decision and Negotiation (GDN2024) Conference, held in Porto under the title “Human-Centric Decision and Negotiation for Societal Transitions”, focused its activities on “ensure that humans remain the main beneficiaries of new services, software, and policies” related to decision making.</p><p>In the last five years, the extraordinary development of ICT and, in particular, the emergence of artificial intelligence (AI), has created a new scenario and new challenges in the integration of humans and technology in the cognitive processes involved in decision-making.</p><p>Within the framework of the Knowledge and Artificial Intelligence Society (KAIS), scientific developments in the decision making field must be aimed at improving the quality of decisions made by individuals and systems. The continuous training of the actors and systems involved in decision making processes is therefore essential.</p><p>Following ideas taken from Bloom’s taxonomy, the education of individuals comprises four domains: cognitive, affective, axiological and psychomotor. What follows is an analysis of how the personal, the social and the technological (artificial intelligence) can complement each other and improve the cognition (knowledge) of people and the systems to which they belong.</p><p>The configuration of an integral cognition that incorporates human, social and artificial cognitions is one of the great challenges that KAIS currently faces. In this sense, it is necessary to identify which tasks required in decision-making processes should be carried out by humans, by society or by technology.</p><p>The configuration of an integral cognition that incorporates human, social and artificial knowledge is one of the great challenges faced by KAIS. Integral cognition aims to make the extraction and diffusion of knowledge derived from the exploitation of large amounts of information in decision making as effective as possible. The complementarity of human, social and artificial cognitions when creating new knowledge by integrating their strengths and capabilities must be analysed. The interactions and interdependencies between the three cognitions and the mechanisms of coordination, collaboration and communication must be studied and understood. It is necessary to identify which tasks required in decision making processes should be undertaken by humans, by society or by technology. Finally, we need to design communication and graphic visualisation tools that allow the dissemination of knowledge to be as effective as possible. Topics of interest include, but are not limited to:</p><ul><li>Challenges in human-technology integration in decision making</li><li>Role of AI in human cognitive processes</li><li>Visualization tools for knowledge dissemination</li><li>Integration of human and social cognitive processes in DSS</li><li>Sentiments and emotions in social networks</li><li>Detection of fake social media news using sentiment analysis</li><li>Clustering in cognitive social networks</li><li>Cognitive identification of phishing messages</li><li>Individual and collective coherence in Group Decision Making</li></ul></div></details>

</template>

<template id="page-doctoral-consortium-2">
<p>Researchers working toward a Ph.D. are invited to submit proposals for the Doctoral Consortium of the 27th Group Decision and Negotiation conference in Chengdu, China. This event will provide an opportunity for graduate students to explore their research interests in an interdisciplinary workshop, under the guidance of a panel of distinguished experts in the field.<br><br>The Doctoral Consortium will provide students with an opportunity to:<br><br>Present their research work in a relaxed and supportive environment<br>Receive feedback and suggestions from peers and experienced faculty members<br>Gain an overview of the breadth and depth of GDN applications and methodologies<br>Obtain insight into directions for GDN research taken by other doctoral candidates<br>Discuss concerns about research, supervision, the job market, and other issues and<br>Network with faculty, peers and future colleagues</p><h2 id="section-1">Paper submission</h2><p>Please follow the procedure explained in the Submission page.<br>Please submit your Doctoral Consortium paper by <strong>15 March 2027</strong>.<br><strong>Select Doctoral Consortium as the conference stream.</strong><br><br><strong>Note:</strong> Papers submitted to the Doctoral Consortium are not eligible for the consideration for the Student Paper Award.</p><h2 id="section-3">Requirements</h2><p>It is open only to doctoral students who have begun or are about to begin their doctoral dissertations;<br><br>Each student with an accepted paper at the Doctoral Consortium has to register and attend GDN 2027 (special student fee applies);<br><br>Each paper must be presented by the student; Presentation and discussion durations will be confirmed in the programme.<br><br>Submissions will be judged mainly on relevance, originality, technical quality and clarity;<br><br>Paper format and length: 2 – 8 pages excluding references. The 2027 Microsoft Word template will be provided here.<br><br>The paper should include the following information: motivation including research aims and research questions, theoretical foundations, research approach, preliminary results (if applicable), an overview of schedule and indication of the current state.</p><h2 id="section-5">Proceedings</h2><p>Accepted papers will be included in local proceedings and they will remain free of copyright.</p><h2 id="section-7">Important Dates for the Doctoral Consortium</h2><p>Submission deadline: <strong>15 March 2027</strong>. See <a href="#important-dates-2">Important Dates</a> for the full conference schedule.</p>
</template>

ce.org</a>&gt; is mandatory for publication. One author may sign the form on behalf of the other authors. In this case, the author signs and accepts the responsibility for releasing this material on behalf of any and all co-authors.<br><br>Authors must provide their <strong>final paper as a pdf file</strong> as well as <strong>all source files</strong> (Word file or LaTeX files with all associated style files, special fonts, references as Bbl files and eps files) send via email &lt;<a href="mailto:gdn2027@gdnconference.org">gdn2027@gdnconference.org</a>&gt;.<br><br>At least one of the authors <strong>must</strong> <strong>be registered for the conference</strong> <strong>by 30 April 2027</strong> for the paper to be published in the proceedings. Registration information is provided <a href="#registration">here</a>.</p><h2 id="section-8">Instructions for authors of Abstracts, Extended Abstracts and Full Papers for Local Proceedings</h2><p>Researchers decide what they submit: Abstracts, extended abstracts or full papers report either on completed research or research-in-progress.<br><br>The paper is 2 pages long for extended abstracts and between 8 and 10 pages long for full papers excluding references.<br><br>Accepted papers will be published in the conference proceedings.<br><br>In the Local Proceedings, the authors of accepted papers will retain the copyright of their papers. After the reviewing process, the authors could choose to replace their full paper in the Local Proceedings for abstract only. However, to be considered for the Conference Awards evaluation process, those papers should be available as full papers in the Local Proceedings, which will be available on the conference webpage under password protection and accessible only to conference participants.<br><br>Instructions and templates are provided for abstracts/extended abstracts/full papers written with Microsoft Word (2027 template to be announced).</p><h2 id="section-10">Instructions for authors of <p class="tourism-intro">Meet Chengdu’s giant pandas, discover the ancient Shu civilisation, and enjoy a city known for its food and unhurried teahouse culture. These suggestions help you plan time around the conference on <strong>6–9 June 2027</strong>.</p>
<article class="panda-feature"><img src="static/images/tourism/panda-base.jpg" alt="Giant panda in a tree at Chengdu Research Base of Giant Panda Breeding" loading="lazy" decoding="async" style="object-position:center"><div class="panda-copy"><span class="destination-label">Start your visit here · Chengdu</span><h2>Chengdu Panda Base</h2><p class="destination-chinese" lang="zh">成都大熊猫繁育研究基地</p><p>See giant pandas in a landscaped research and conservation setting. A morning visit is a good starting point for a Chengdu itinerary; leave enough time to walk between the different areas.</p><p>Check the official ticket and reservation information before travelling. Animal visibility varies, so a particular panda or activity cannot be guaranteed.</p><a class="btn" href="https://www.panda.org.cn/en/" target="_blank" rel="noopener">Plan a panda visit <span aria-hidden="true">↗</span></a></div></article>
<div class="tourism-heading"><span class="eyebrow">History, heritage & city life</span><h2>More places to discover</h2></div><div class="destination-grid"><article class="destination-card"><img src="static/images/tourism/sanxingdui.jpg" alt="Sanxingdui Museum" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">Guanghan · day-trip idea</span><h3>Sanxingdui Museum</h3><p class="destination-chinese" lang="zh">三星堆博物馆</p><p>Explore the remarkable bronze masks and archaeological discoveries of the ancient Shu civilisation. The museum is outside Chengdu in Guanghan; plan this as a dedicated excursion and check admission arrangements in advance.</p><a class="text-link" href="https://www.sxd.cn/Guide?classify=100&amp;type=102" target="_blank" rel="noopener">Official visitor information <span aria-hidden="true">↗</span></a></div></article><article class="destination-card"><img src="static/images/tourism/dujiangyan.jpg" alt="Dujiangyan" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">Heritage · day-trip idea</span><h3>Dujiangyan</h3><p class="destination-chinese" lang="zh">都江堰</p><p>Discover the historic irrigation system on the Min River, part of the Mount Qingcheng and Dujiangyan UNESCO World Heritage site. Built more than two millennia ago, it remains an extraordinary example of working water engineering.</p><a class="text-link" href="https://whc.unesco.org/en/list/1001/" target="_blank" rel="noopener">UNESCO heritage information <span aria-hidden="true">↗</span></a></div></article><article class="destination-card"><img src="static/images/tourism/kuanzhai.jpg" alt="Kuanzhai Alleys" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">Central Chengdu · easy city outing</span><h3>Kuanzhai Alleys</h3><p class="destination-chinese" lang="zh">宽窄巷子</p><p>Stroll through the Wide and Narrow Alleys, where courtyard architecture, small shops, cafés and teahouses offer a relaxed introduction to Chengdu. It is an inviting place for an afternoon walk or an evening meal.</p></div></article></div><div class="tourism-heading"><span class="eyebrow">Experience the city</span><h2>Culture & flavour</h2></div><div class="destination-grid culture-grid"><article class="destination-card"><img src="static/images/tourism/sichuan-opera.jpg" alt="Sichuan Opera" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">An evening in Chengdu</span><h3>Sichuan Opera</h3><p class="destination-chinese" lang="zh">川剧与变脸</p><p>Enjoy vivid costumes, music and the celebrated face-changing tradition of Sichuan opera. Check the programme and language support of the individual venue when booking; performances and seats are arranged independently of the conference.</p><a class="text-link" href="https://english.scio.gov.cn/m/chinafacts/2017-04/13/content_40612048.htm" target="_blank" rel="noopener">About face-changing <span aria-hidden="true">↗</span></a></div></article><article class="destination-card"><img src="static/images/tourism/sichuan-cuisine.jpg" alt="Sichuan Cuisine" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">A UNESCO City of Gastronomy</span><h3>Sichuan Cuisine</h3><p class="destination-chinese" lang="zh">川菜与成都茶馆</p><p>Try mapo tofu, dan dan noodles, kung pao chicken or Sichuan hotpot, and make time for tea in a local teahouse. Ask about spice levels and dietary requirements when ordering; Sichuan cuisine offers much more than heat alone.</p><a class="text-link" href="https://www.unesco.org/en/creative-cities/chengdu" target="_blank" rel="noopener">Chengdu’s food culture <span aria-hidden="true">↗</span></a></div></article></div><div class="tourism-heading"><span class="eyebrow">Stay a little longer</span><h2>Further into Sichuan</h2></div><div class="destination-grid culture-grid"><article class="destination-card"><img src="static/images/tourism/leshan.jpg" alt="Leshan Giant Buddha" loading="lazy" decoding="async" style="object-position:center"><div class="destination-copy"><span class="destination-label">A full-day or overnight excursion</span><h3>Leshan Giant Buddha</h3><p class="destination-chinese" lang="zh">乐山大佛</p><p>Visit the monumental Buddha carved into the riverside cliff, within the Mount Emei Scenic Area including Leshan Giant Buddha UNESCO World Heritage site. Allow time for onward transport and the site visit; an overnight stay gives more flexibility.</p><a class="text-link" href="https://whc.unesco.org/en/list/779/" target="_blank" rel="noopener">UNESCO heritage information <span aria-hidden="true">↗</span></a></div></article><article class="destination-card"><img src="static/images/tourism/jiuzhaigou.jpg" alt="Jiuzhaigou Valley" loading="lazy" decoding="async" style="object-position:center 48%"><div class="destination-copy"><span class="destination-label">Plan several days beyond Chengdu</span><h3>Jiuzhaigou Valley</h3><p class="destination-chinese" lang="zh">九寨沟</p><p>Turquoise lakes, waterfalls and forested valleys make Jiuzhaigou a memorable extension to a Sichuan visit. It is a longer journey from Chengdu: allow several days, check park reservations and transport, and prepare for higher elevations.</p><a class="text-link" href="https://www.jiuzhai.com/" target="_blank" rel="noopener">Official park information <span aria-hidden="true">↗</span></a></div></article></div><section class="more-chengdu"><h2>More time in Chengdu?</h2><p><strong>Wuhou Shrine and Jinli</strong> offer another city outing combining heritage and traditional streets. <strong>People’s Park</strong> is a place to enjoy teahouse life; the <strong>Jinjiang riverside and Jiuyan Bridge area</strong> add an evening walk to the itinerary.</p></section><p class="tourism-planning">These are independent travel ideas, rather than scheduled conference excursions. Check opening arrangements, reservations, transport and weather close to your visit. Photographs illustrate the places and experiences; seasonal appearance may differ.</p><details class="photo-credits"><summary>Photo credits</summary><p>Photographs by the authors listed below. Images are displayed in cropped card frames; the credited image files retain their stated licences.</p><ul><li><strong>Sanxingdui Museum</strong> — Gary Todd · <a href="https://commons.wikimedia.org/wiki/File:Ancient_Bronze_Mask-_Largest_Bronze_Mask_Unearthed_at_Sanxingdui_f.jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>.</li><li><strong>Dujiangyan Irrigation System</strong> — Gjl · <a href="https://commons.wikimedia.org/wiki/File:Dujiangyan_Irrigation_System.jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>.</li><li><strong>Kuanzhai Alleys, Chengdu</strong> — Daderot · <a href="https://commons.wikimedia.org/wiki/File:Street_scene_-_Kuanzhai_Alleys_-_Chengdu,_China_-_DSC05311.jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>.</li><li><strong>Chengdu Research Base of Giant Panda Breeding</strong> — Zairon · <a href="https://commons.wikimedia.org/wiki/File:Chengdu_Chengdu_Panda_Reserve_Base_Gro%C3%9Fe_Pandas_27.jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</li><li><strong>Jiuzhaigou</strong> — chensiyuan · <a href="https://commons.wikimedia.org/wiki/File:1_jiuzhaigou_valley_national_park_wu_hua_hai.jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</li><li><strong>Leshan Giant Buddha</strong> — xiquinhosilva · <a href="https://commons.wikimedia.org/wiki/File:Leshan_Giant_Buddha_(1).jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC BY 2.0</a>.</li><li><strong>Sichuan Opera</strong> — Bernt Rostad · <a href="https://commons.wikimedia.org/wiki/File:Sichuan_opera_(3772221986).jpg" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC BY 2.0</a>.</li><li><strong>Sichuan Cuisine</strong> — Kos88 · <a href="https://commons.wikimedia.org/wiki/File:Mapo_doufu_by_Chen_Mapo_Restaurant_in_Chengdu_Sichuan%EF%BC%88%E9%99%B3%E9%BA%BB%E5%A9%86%E8%B1%86%E8%85%90%E5%BA%97%E3%81%AE%E9%BA%BB%E5%A9%86%E8%B1%86%E8%85%90%EF%BC%89.JPG" target="_blank" rel="noopener">Wikimedia Commons source</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.</li></ul></details>

nsit to a third country or region; a simple return trip should not be assumed to qualify. Check the full official requirements against your itinerary.</p><div class="notice">For travel in <strong>June 2027</strong>, check that the relevant policy is valid on your arrival date. A policy or temporary exemption available earlier should not be assumed to cover the conference dates.</div><div class="visa-resources"><a class="resource" href="https://en.nia.gov.cn/n147418/n147463/c183412/content.html" target="_blank" rel="noopener noreferrer">National Immigration Administration · transit requirements</a><a class="resource" href="https://www.visaforchina.cn/HAM3_EN/qianzhengyewu/jichuzhishi/banliliucheng" target="_blank" rel="noopener noreferrer">Official visa categories</a></div><h2>Allow time before departure</h2><p>Apply early enough for appointments, document preparation and any additional checks. Processing schedules depend on the issuing authority. An invitation letter supports an application and does not guarantee that a visa will be granted.</p><p><a href="#travel">Airport and local travel information</a> · <a href="#hotel-information">Accommodation</a></p>
